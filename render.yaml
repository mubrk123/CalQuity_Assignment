services:
  - type: web
    name: parcelpilot
    runtime: python
    pythonVersion: "3.11"
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParcelPilot AI Support</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --line2:#eef0f3;
  --tx:#16191d; --tx2:#5b6470; --tx3:#8b95a3;
  --ac:#4f46e5; --acbg:#eef2ff;
  --ok:#0f8a4e; --okbg:#e8f7ee; --warn:#b45309; --warnbg:#fef4e6;
  --crit:#c62828; --critbg:#fdecec;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d8e0;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:200px 1fr;height:100dvh;min-height:0;overflow:hidden}

/* ---------- nav ---------- */
.nav{background:#fcfcfd;border-right:1px solid var(--line);padding:14px 10px;
  display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:8px;padding:0 6px 14px;margin-bottom:8px;border-bottom:1px solid var(--line2);flex:none}
.logo{width:23px;height:23px;border-radius:6px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.brand b{font-size:13px;font-weight:620;letter-spacing:-.1px}
.nl{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;
  border-radius:7px;font-size:13px;color:var(--tx2);margin-bottom:2px}
.nl:hover{background:#f2f3f6}
.nl.on{background:var(--acbg);color:var(--ac);font-weight:600}
.nl .ic{width:15px;text-align:center;opacity:.85;flex:none}
.nl .cnt{margin-left:auto;font-size:11px;font-weight:650;background:var(--critbg);color:var(--crit);padding:0 6px;border-radius:9px}
.reft{margin-top:14px;padding:0 8px;font-size:10.5px;color:var(--tx3);line-height:1.45;flex:none}

.who{margin-top:auto;padding-top:14px;flex:none;position:relative}
.whobox{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;
  display:flex;align-items:center;gap:8px;text-align:left;background:#fff}
.whobox:hover{border-color:#cfd4dc}
.av{width:23px;height:23px;border-radius:50%;background:#dfe3ea;flex:none;display:grid;place-items:center;font-size:10px;font-weight:650;color:var(--tx2)}
.whobox .n{font-weight:600;font-size:12px;line-height:1.2}
.whobox .r{font-size:10.5px;color:var(--tx3)}
.whobox .ch{margin-left:auto;color:var(--tx3);font-size:10px}
.menu{position:absolute;bottom:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 8px 28px rgba(16,24,40,.13);padding:5px;display:none;z-index:30;max-height:340px;overflow-y:auto}
.menu.open{display:block}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:12px}
.mi:hover{background:#f4f5f8}
.mi.on{background:var(--acbg)}
.mi .n{font-weight:600;line-height:1.2}
.mi .r{font-size:10.5px;color:var(--tx3)}
.mgrp{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);padding:7px 8px 3px}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--card)}
.hd{flex:none;padding:13px 24px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.hd h2{font-size:14.5px;font-weight:620}
.hd .meta{font-size:11.5px;color:var(--tx3);margin-left:auto;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--crit)}
.dot.ok{background:var(--ok)}
.pane{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:22px 24px;display:none}
.pane.on{display:block}
.col{max-width:660px;margin:0 auto}
.wcol{max-width:820px;margin:0 auto}

/* ---------- chat ---------- */
.u{display:flex;justify-content:flex-end;margin-bottom:18px}
.u div{background:var(--ac);color:#fff;padding:8px 13px;border-radius:14px 14px 4px 14px;font-size:13.5px;max-width:80%;white-space:pre-wrap}
.a{margin-bottom:18px}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:650;padding:5px 11px;border-radius:7px;margin-bottom:11px}
.verdict.ok{background:var(--okbg);color:var(--ok)}
.verdict.no{background:var(--critbg);color:var(--crit)}
.verdict.wn{background:var(--warnbg);color:var(--warn)}
.a p{font-size:13.5px;margin-bottom:9px}
.a p:last-child{margin-bottom:0}
.a strong{font-weight:640}
.a code{font:12px var(--mono);background:#f2f3f6;padding:1px 5px;border-radius:4px}
.a ul{margin:0 0 10px 20px;font-size:13.5px}
.a li{margin-bottom:3px}
.a em{font-style:italic;color:var(--tx2)}

.acc{border:1px solid var(--line);border-radius:8px;margin-top:9px;overflow:hidden}
.acc>summary{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;
  color:var(--tx2);background:#fcfcfd;cursor:pointer;list-style:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:#f4f5f8}
.acc .ct{margin-left:auto;font-size:11px;color:var(--tx3)}
.acc .c{border-top:1px solid var(--line2);padding:11px 12px}
.src{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line2)}
.src:last-child{border:0;padding-bottom:0}
.src:first-child{padding-top:0}
.tier{font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:4px;height:17px;flex:none;white-space:nowrap}
.t1{background:#fff1e6;color:#b4530a}.t2{background:#e8effd;color:#1d4ed8}
.t3{background:#e9f7ee;color:#0f7a45}.t90{background:#f0f1f3;color:#6b7280}
.t99{background:#f6f0ff;color:#6d28d9}
.src .nm{font-size:12px;font-weight:600}
.src .q{font-size:11.5px;color:var(--tx2);font-style:italic;margin-top:1px}
.step{display:flex;align-items:center;gap:9px;font-size:12px;padding:5px 0;color:var(--tx2)}
.step code{font:11px var(--mono);color:var(--ac)}
.step .rs{margin-left:auto;font-size:11px;color:var(--tx3);text-align:right}
.step .sp{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.step .gd{color:var(--ok);flex:none}.step .bd{color:var(--crit);flex:none}
.step .lbl{font-size:12px}
.step .tool{font:10.5px var(--mono);color:var(--tx3);margin-left:6px}
.live{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--tx2);
  padding:9px 0 4px;margin-bottom:14px}
.live .sp{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--ac);
  border-radius:50%;animation:sp .7s linear infinite;flex:none}
.live span.t{animation:fade .25s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
.kvj{font:11px var(--mono);color:var(--tx2);white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto;margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
.flag{display:flex;gap:8px;font-size:12.5px;background:var(--warnbg);color:#7c4a05;padding:9px 11px;border-radius:8px;margin:11px 0}
.flag b{font-weight:650}

.confirm{border:1px solid #f0d9a8;background:#fffdf7;border-radius:10px;overflow:hidden;margin-top:11px}
.confirm .ch{padding:8px 13px;background:var(--warnbg);font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8a5304}
.confirm .cb{padding:13px}
.confirm h4{font-size:13.5px;font-weight:640;margin-bottom:9px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:12.5px;margin-bottom:12px}
.kv dt{color:var(--tx3)}
.btns{display:flex;gap:8px}
.b1{background:var(--ac);color:#fff;padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:620}
.b1:hover{background:#4338ca}
.b2{background:#fff;color:var(--tx2);border:1px solid var(--line);padding:7px 14px;border-radius:7px;font-size:12.5px}
.b1:disabled,.b2:disabled{opacity:.5;cursor:not-allowed}
.blocked{font-size:11.5px;color:var(--warn);margin-bottom:10px}
.done{padding:10px 13px;background:var(--okbg);border:1px solid #bfe6cd;border-radius:8px;font-size:12.5px;color:var(--ok);margin-top:11px}

/* composer */
.comp{flex:none;border-top:1px solid var(--line2);padding:13px 24px 16px;background:#fcfcfd}
.cw{max-width:660px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
textarea{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--tx);font:inherit;resize:none;max-height:130px;outline:none}
textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.send{background:var(--ac);color:#fff;width:38px;height:38px;border-radius:10px;font-size:15px;flex:none}
.send:disabled{opacity:.4}
.warnbar{max-width:660px;margin:0 auto 10px;padding:8px 12px;background:var(--critbg);border:1px solid #f5c6c6;border-radius:7px;font-size:12px;color:#96201f}

/* empty + suggestions */
.empty{text-align:center;padding:48px 20px 26px}
.empty .lg{width:38px;height:38px;border-radius:10px;background:var(--acbg);color:var(--ac);font-size:17px;display:grid;place-items:center;margin:0 auto 13px}
.empty h3{font-size:15.5px;font-weight:640;margin-bottom:5px}
.empty p{font-size:13px;color:var(--tx2);max-width:44ch;margin:0 auto}
.sugg{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:22px}
.sg{font-size:12.5px;border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:18px;color:var(--tx2)}
.sg:hover{border-color:var(--ac);color:var(--ac)}

/* today */
.chips{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:16px;border:1px solid var(--line);color:var(--tx2);background:#fff}
.chip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);margin:22px 0 8px}
.grp:first-child{margin-top:0}
.item{display:flex;gap:11px;padding:12px 13px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fff}
.item:hover{border-color:#cfd4dc}
.idot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none}
.d-critical{background:var(--crit)}.d-high{background:#e0a010}
.d-medium{background:#7b8794}.d-low{background:#c3c9d2}
.item .t{font-size:13px;font-weight:600}
.item .s{font-size:12px;color:var(--tx2);margin-top:2px}
.item .ev{font-size:10.5px;color:var(--tx3);margin-top:4px;font-family:var(--mono)}
.item .a2{font-size:12px;color:var(--ac);margin-top:6px;font-weight:550;text-align:left}
.item .a2:hover{text-decoration:underline}
.item .rt{margin-left:auto;font-size:11px;color:var(--tx3);white-space:nowrap;flex:none}

/* tables / pages */
h3.ph{font-size:15px;font-weight:640;margin-bottom:4px}
p.ps{font-size:12.5px;color:var(--tx2);margin-bottom:16px;max-width:70ch}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--tx3);font-weight:650;padding:9px 12px;background:#fbfbfc;border-bottom:1px solid var(--line2)}
td{padding:9px 12px;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:0}
td.m{font:11.5px var(--mono);color:var(--ac)}
.badge{font-size:10.5px;padding:2px 7px;border-radius:11px;background:#f0f1f3;color:var(--tx2);font-weight:600}
.badge.open{background:var(--warnbg);color:var(--warn)}
.gov{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.gov:last-child{border:0}
.gov .k{color:var(--tx2)}
.gov .v{color:var(--tx3);text-align:right}
.gov .v.c{color:#b4530a;font-weight:600}
.doc{display:flex;gap:9px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.doc:last-child{border:0}
.doc.dep{opacity:.55}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-bottom:9px}
.card h4{font-size:12.5px;font-weight:640;margin-bottom:4px}
.card p{font-size:12px;color:var(--tx2)}
.note{font-size:12.5px;color:var(--tx2);background:#fff;border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:0 8px 8px 0;padding:11px 13px;margin-bottom:16px}
.mut{color:var(--tx3);font-size:12.5px;text-align:center;padding:40px 0}
@media(max-width:820px){.app{grid-template-columns:1fr}.nav{display:none}html,body{overflow:auto}.app{height:auto}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="brand"><div class="logo">P</div><b>ParcelPilot</b></div>
    <div id="navLinks"></div>
    <div class="reft" id="reft"></div>
    <div class="who">
      <button class="whobox" id="whoBtn">
        <span class="av" id="whoAv">–</span>
        <span><span class="n" id="whoName">…</span><br><span class="r" id="whoRole"></span></span>
        <span class="ch">▾</span>
      </button>
      <div class="menu" id="whoMenu"></div>
    </div>
  </nav>

  <main class="main">
    <div class="hd">
      <h2 id="pgTitle">Ask</h2>
      <div class="meta"><span id="pgMeta"></span><span class="dot" id="mdot" title="model"></span></div>
    </div>

    <div class="pane on" id="pAsk"></div>
    <div class="pane" id="pToday"></div>
    <div class="pane" id="pData"></div>
    <div class="pane" id="pAccount"></div>
    <div class="pane" id="pSources"></div>

    <div class="comp" id="composer">
      <div id="warnHost"></div>
      <div class="cw">
        <textarea id="input" rows="1" placeholder="Ask about a shipment, a fee, a credit, or response times…"></textarea>
        <button class="send" id="send">↑</button>
      </div>
    </div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={session:null,sessions:[],ctx:null,history:[],busy:false,page:'ask',ops:null};

const NAV={
  customer:[['ask','◇','Ask'],['data','▤','My shipments'],['account','◈','My plan']],
  staff:[['ask','◇','Ask'],['today','◎','Today'],['data','▤','Tickets & orders'],['account','◈','Accounts'],['sources','📄','Documents']]
};
const TITLES={ask:'Ask',today:'Today',data:'Records',account:'Account',sources:'Documents'};
const SUGG={
  customer:["Can I cancel ORD-1001 without a cancellation fee?","My pickup was three hours late due to carrier fault — do I get a credit?","How fast will you respond if all our shipments stop working?","Why did my 4,200-row CSV upload fail?"],
  staff:["Can Northstar cancel ORD-1001 without a cancellation fee? Explain why.","Which open tickets are past their first-response target?","Is LumenWorks owed anything on ORD-2002?","Has any customer been given wrong guidance in a past ticket?"]
};
// outcome -> headline verdict chip
const VERDICT={
  cancellable_no_fee:['ok','No cancellation fee'],
  cancellable_no_fee_pending_verification:['ok','No cancellation fee'],
  cancellable_with_fee:['wn','Cancellation fee applies'],
  not_cancellable:['no','Cannot be cancelled'],
  eligible:['ok','Service credit due'],
  not_eligible:['no','No service credit due'],
  cannot_determine:['wn','Needs verification'],
  insufficient_data:['wn','Not enough data'],
  unknown_status:['wn','Needs a human'],
  target_exceeded:['no','Response target exceeded'],
  within_target:['ok','Within response target'],
  within_target_clock_not_started:['ok','Within target — clock not started']
};

/* ---------------- boot ---------------- */
async function boot(){
  const h=await(await fetch('/api/health')).json();
  $('#mdot').className='dot'+(h.model_configured?' ok':'');
  $('#mdot').title=h.model_configured?`${h.provider} · ${h.model}`:'no model API key configured';
  if(!h.model_configured) $('#warnHost').innerHTML=
    `<div class="warnbar">No model key configured — set <code>LLM_API_KEY</code> to enable chat. Other pages work without it.</div>`;
  $('#reft').textContent='Reference time · '+h.reference_time;
  S.sessions=(await(await fetch('/api/sessions')).json()).sessions;
  buildMenu(); await pick(S.sessions[0].key);
}

function buildMenu(){
  const m=$('#whoMenu'); m.innerHTML='';
  const add=(label,list)=>{
    m.appendChild(el('div','mgrp',label));
    list.forEach(s=>{
      const b=el('button','mi'+(s.key===S.session?' on':''));
      b.innerHTML=`<span class="av">${esc((s.display_name||'?').slice(0,2).toUpperCase())}</span>
        <span><span class="n">${esc(s.display_name)}</span><br>
        <span class="r">${s.is_internal?esc(s.role.replace('_',' ')):esc(s.account_id+' · '+(s.plan||''))}</span></span>`;
      b.onclick=()=>{m.classList.remove('open');pick(s.key)};
      m.appendChild(b);
    });
  };
  add('Customers',S.sessions.filter(s=>!s.is_internal));
  add('ParcelPilot staff',S.sessions.filter(s=>s.is_internal));
}
$('#whoBtn').onclick=e=>{e.stopPropagation();$('#whoMenu').classList.toggle('open')};
document.addEventListener('click',()=>$('#whoMenu').classList.remove('open'));

async function pick(key){
  S.session=key; S.history=[]; S.ops=null;
  const s=S.sessions.find(x=>x.key===key);
  $('#whoName').textContent=s.display_name;
  $('#whoRole').textContent=s.is_internal?s.role.replace('_',' '):`${s.account_id} · ${s.plan}`;
  $('#whoAv').textContent=(s.display_name||'?').slice(0,2).toUpperCase();
  buildMenu();

  const links=NAV[s.is_internal?'staff':'customer'];
  const host=$('#navLinks'); host.innerHTML='';
  links.forEach(([id,ic,label])=>{
    const b=el('button','nl'+(id===S.page?' on':''));
    b.innerHTML=`<span class="ic">${ic}</span>${esc(label)}`+
      (id==='today'?'<span class="cnt" id="todayCnt"></span>':'');
    b.onclick=()=>go(id); host.appendChild(b);
  });
  if(!links.some(l=>l[0]===S.page)) S.page='ask';

  S.ctx=await(await fetch('/api/context/'+key)).json();
  resetAsk(s); renderData(); renderAccount(); renderSources();
  go(S.page);
  if(s.is_internal) loadToday();
}

function go(page){
  S.page=page;
  document.querySelectorAll('.nl').forEach((b,i)=>{
    const s=S.sessions.find(x=>x.key===S.session);
    b.classList.toggle('on',NAV[s.is_internal?'staff':'customer'][i][0]===page);
  });
  ['Ask','Today','Data','Account','Sources'].forEach(p=>
    $('#p'+p).classList.toggle('on',p.toLowerCase()===page));
  $('#pgTitle').textContent=TITLES[page];
  $('#pgMeta').textContent=page==='today'&&S.ops?`${S.ops.summary.signals} signals`:'';
  $('#composer').style.display=page==='ask'?'':'none';
  if(page==='today'&&!S.ops) loadToday();
}

/* ---------------- ask ---------------- */
function resetAsk(s){
  const list=(s.is_internal?SUGG.staff:SUGG.customer)
    .map(q=>`<button class="sg">${esc(q)}</button>`).join('');
  $('#pAsk').innerHTML=`<div class="col"><div class="empty">
    <div class="lg">◇</div><h3>What can I help with?</h3>
    <p>${s.is_internal?'You can see every account. Ask about any order, ticket or policy.'
      :'Ask about your shipments, your entitlements, or our policies.'}</p>
    <div class="sugg">${list}</div></div></div>`;
  $('#pAsk').querySelectorAll('.sg').forEach(b=>b.onclick=()=>{$('#input').value=b.textContent;send()});
}
const feed=()=>{let c=$('#pAsk').querySelector('.col');
  if($('#pAsk').querySelector('.empty')){$('#pAsk').innerHTML='<div class="col"></div>';c=$('#pAsk').querySelector('.col')}
  return c};
function scroll(){$('#pAsk').scrollTop=$('#pAsk').scrollHeight}
function md(t){
  const inline = x => x
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s.,;:!?)]|$)/g,'$1<em>$2</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
  const BULLET = /^\s*[-*\u2022]\s+/;
  // Group consecutive bullet lines into a real list. The model habitually puts
  // a bold heading directly above its bullets, so a whole-block test misses.
  return esc(t).split(/\n\n+/).map(block=>{
    let html='', run=[];
    const flush = () => {
      if(!run.length) return;
      html += '<ul>'+run.map(l=>`<li>${inline(l)}</li>`).join('')+'</ul>';
      run=[];
    };
    let para=[];
    const flushPara = () => {
      if(!para.length) return;
      html += `<p>${inline(para.join('<br>'))}</p>`;
      para=[];
    };
    block.split('\n').forEach(line=>{
      if(BULLET.test(line)){ flushPara(); run.push(line.replace(BULLET,'')); }
      else { flush(); if(line.trim()) para.push(line); }
    });
    flush(); flushPara();
    return html;
  }).join('')}

const DOING={
  search_policy_documents:'Searching policy and agreement documents',
  get_account_context:'Checking which rules apply to this account',
  get_order:'Looking up the shipment',
  list_orders:'Reviewing shipments',
  lookup_tickets:'Looking up support tickets',
  search_ticket_history:'Reviewing past tickets for context',
  evaluate_cancellation:'Applying the cancellation rules',
  evaluate_service_credit:'Applying the service-credit rules',
  evaluate_sla:'Checking severity and response target',
  get_source_reliability:'Checking which sources take precedence',
  prepare_action:'Preparing a draft for your approval',
  list_pending_actions:'Checking pending drafts'
};
const OUTCOME={
  cancellable_no_fee:'no fee', cancellable_no_fee_pending_verification:'no fee, verify pickup',
  cancellable_with_fee:'fee applies', not_cancellable:'cannot be cancelled',
  eligible:'credit due', not_eligible:'no credit due',
  cannot_determine:'cannot determine', insufficient_data:'not enough data',
  target_exceeded:'target exceeded', within_target:'within target',
  within_target_clock_not_started:'clock not started'
};
/* What each step actually found — the top source it landed on, or the verdict.
   A passage count told the reader nothing. */
function stepResult(name,r){
  if(!r) return '';
  if(r.error) return r.error.replace(/_/g,' ');
  if(r.found===false) return 'not found';
  if(name==='search_policy_documents'){
    const top=(r.results||[])[0];
    return top?top.source:'nothing matched';
  }
  if(name==='get_account_context') return `${r.account_name} · ${r.plan}`;
  if(name==='get_order') return `${r.order.order_id} · ${r.order.status}`;
  if(name==='list_orders') return `${r.count} shipments`;
  if(name==='lookup_tickets') return r.ticket?r.ticket.ticket_id:`${r.count} tickets`;
  if(name==='search_ticket_history') return `${r.count} past tickets · unverified`;
  if(name==='prepare_action') return r.prepared?'draft ready for approval':'could not draft';
  if(r.outcome) return OUTCOME[r.outcome]||r.outcome.replace(/_/g,' ');
  return 'done';
}

let stepLog=[], cites=[], verdict=null, live=null;

function showLive(text){
  if(!live){
    live=el('div','live');
    live.innerHTML='<span class="sp"></span><span class="t"></span>';
    feed().appendChild(live);
  }
  const t=live.querySelector('.t');
  t.textContent=text;
  t.style.animation='none'; void t.offsetWidth; t.style.animation='';
  scroll();
}
function clearLive(){ if(live){live.remove(); live=null} }

function renderSteps(){
  if(!stepLog.length) return;
  const d=el('details','acc');
  d.innerHTML=`<summary>⚙ How I checked<span class="ct">${stepLog.length} ${
    stepLog.length===1?'step':'steps'}</span></summary><div class="c">${
    stepLog.map(st=>`<div class="step">
      <span class="${st.bad?'bd':'gd'}">${st.bad?'✕':'✓'}</span>
      <span class="lbl">${esc(st.label)}<span class="tool">${esc(st.name)}</span></span>
      <span class="rs">${esc(st.result)}</span></div>`).join('')}</div>`;
  feed().appendChild(d); scroll();
}

function renderAnswer(text){
  const box=el('div','a');
  if(verdict) box.appendChild(el('div','verdict '+verdict[0],`${verdict[0]==='ok'?'✓':verdict[0]==='no'?'✕':'⚠'} ${esc(verdict[1])}`));
  box.insertAdjacentHTML('beforeend',md(text));
  feed().appendChild(box); scroll();
  if(cites.length){
    const d=el('details','acc');
    d.innerHTML=`<summary>📄 Policy references<span class="ct">${cites.length}</span></summary>
      <div class="c">${cites.map(c=>`<div class="src"><span class="tier t${c.tier}">${
        c.tier===1?'CONTRACT':c.tier===2?'POLICY':c.tier===3?'PRODUCT':c.tier===90?'DEPRECATED':'TICKET'
      }</span><div><div class="nm">${esc(c.source)}</div>
      <div class="q">“${esc(c.quote)}”</div></div></div>`).join('')}</div>`;
    feed().appendChild(d);
  }
  scroll();
}

function renderAction(a){
  const c=el('div','confirm');
  const rows=Object.entries(a.preview||{}).filter(([k])=>!['title','kind'].includes(k))
    .map(([k,v])=>`<dt>${esc(k.replace(/_/g,' '))}</dt><dd>${esc(v)}</dd>`).join('');
  c.innerHTML=`<div class="ch">⚠ Draft — nothing created yet</div><div class="cb">
    <h4>${esc(a.preview.title||a.kind)}</h4><dl class="kv">${rows}</dl>
    ${a.blocked_reason?`<div class="blocked">⚠ ${esc(a.blocked_reason)}</div>`:''}
    <div class="btns"><button class="b1">Create ${esc(a.kind.replace(/_/g,' '))}</button>
    <button class="b2">Discard</button></div></div>`;
  const [go_,no]=c.querySelectorAll('button');
  go_.onclick=async()=>{go_.disabled=no.disabled=true;go_.textContent='Creating…';
    const r=await fetch(`/api/actions/${a.action_id}/confirm`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({session:S.session})});
    const j=await r.json();
    c.replaceWith(el('div','done',r.ok?`✓ ${esc(j.message)}`:`✕ ${esc(j.detail||'could not create')}`));scroll()};
  no.onclick=async()=>{await fetch(`/api/actions/${a.action_id}/cancel`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({session:S.session})});
    c.replaceWith(el('div','done','Discarded — nothing was created.'))};
  feed().appendChild(c); scroll();
}

async function send(){
  const box=$('#input'), text=box.value.trim();
  if(!text||S.busy) return;
  if(S.page!=='ask') go('ask');
  box.value=''; box.style.height='auto'; S.busy=true; $('#send').disabled=true;
  stepLog=[]; cites=[]; verdict=null; live=null;
  const u=el('div','u'); u.appendChild(el('div',null,esc(text))); feed().appendChild(u); scroll();

  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session:S.session,message:text,history:S.history})});
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const part of parts){
        const line=part.split('\n').find(l=>l.startsWith('data: ')); if(!line) continue;
        let ev; try{ev=JSON.parse(line.slice(6))}catch{continue}
        if(ev.type==='status')
          showLive(ev.iteration>1?'Reviewing what I found…':'Thinking…');
        else if(ev.type==='tool_call')
          showLive((DOING[ev.name]||'Working')+'…');
        else if(ev.type==='tool_result'){
          const r=ev.result||{};
          stepLog.push({name:ev.name, label:DOING[ev.name]||ev.name,
            result:stepResult(ev.name,r), bad:!!(r.error||r.found===false)});
          (r.citations||[]).forEach(c=>{if(!cites.some(x=>x.source===c.source&&x.quote===c.quote))cites.push(c)});
          if(!verdict&&VERDICT[r.outcome]) verdict=VERDICT[r.outcome];
          showLive('Preparing the answer…');
        }
        else if(ev.type==='message'){ clearLive(); renderAnswer(ev.content); renderSteps() }
        else if(ev.type==='error'){ clearLive(); renderAnswer(`**${ev.kind}** — ${ev.detail}`); renderSteps() }
        else if(ev.type==='done'){S.history=ev.messages||S.history;(ev.pending_actions||[]).forEach(renderAction)}
      }
    }
  }catch(e){clearLive(); renderAnswer('**Connection error** — '+e.message)}
  clearLive();
  S.busy=false; $('#send').disabled=false; box.focus();
}
$('#send').onclick=send;
$('#input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#input').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'});

/* ---------------- today ---------------- */
const GROUPS=[
  ['Needs a reply now',i=>i.level==='critical'],
  ['Nobody has asked about these',i=>['stale_pickup','unclaimed_credit','wrong_past_guidance'].includes(i.signal)],
  ['Worth knowing',()=>true]
];
async function loadToday(){
  const p=$('#pToday'); p.innerHTML='<div class="mut">Loading…</div>';
  const r=await fetch('/api/dashboard/'+S.session);
  if(!r.ok){p.innerHTML='<div class="mut">Not available for this role.</div>';return}
  const d=await r.json(); S.ops=d;
  const cnt=$('#todayCnt'); if(cnt) cnt.textContent=d.summary.critical||'';
  if(S.page==='today') $('#pgMeta').textContent=`${d.summary.signals} signals`;

  const used=new Set(); let html='';
  GROUPS.forEach(([label,test])=>{
    const list=d.insights.filter(i=>!used.has(i)&&test(i)); list.forEach(i=>used.add(i));
    if(!list.length) return;
    html+=`<div class="grp">${esc(label)}</div>`+list.map(i=>{
      const idx=d.insights.indexOf(i);
      return `<div class="item"><span class="idot d-${i.level}"></span><div style="min-width:0">
        <div class="t">${esc(i.title)}</div><div class="s">${esc(i.detail)}</div>
        ${i.evidence&&i.evidence.length?`<div class="ev">${esc(i.evidence.join(' · '))}</div>`:''}
        ${i.recommended_action?`<button class="a2" data-i="${idx}">${esc(i.recommended_action)} →</button>`:''}
      </div><span class="rt">${esc(metric(i))}</span></div>`}).join('');
  });
  p.innerHTML=`<div class="wcol"><div class="note">${esc(d.method)}</div>
    <p class="ps">${esc(d.reference_time)} · ${d.summary.open_tickets} open tickets across ${d.summary.accounts} accounts</p>
    ${html}</div>`;
  p.querySelectorAll('.a2').forEach(b=>b.onclick=()=>{
    const i=d.insights[b.dataset.i];
    $('#input').value=`${i.title}. Records: ${i.records.join(', ')}. What should we do and why?`;
    send();});
}
function metric(i){
  const m=i.metrics||{};
  if(m.minutes_over!=null) return m.minutes_over+' min over';
  if(m.minutes_remaining!=null) return 'due in '+m.minutes_remaining+' min';
  if(m.hours_overdue!=null) return m.hours_overdue+'h overdue';
  if(m.credit_inr!=null) return '₹'+m.credit_inr;
  if(m.accounts>1) return m.accounts+' accounts';
  if(m.severity) return m.severity;
  return '';
}

/* ---------------- records ---------------- */
function renderData(){
  const c=S.ctx, staff=S.sessions.find(x=>x.key===S.session).is_internal;
  $('#pData').innerHTML=`<div class="wcol">
    <h3 class="ph">Shipments</h3><p class="ps">${c.orders.length} visible to you.</p>
    <table><thead><tr><th>Order</th>${staff?'<th>Account</th>':''}<th>Status</th><th>Carrier</th></tr></thead>
    <tbody>${c.orders.map(o=>`<tr><td class="m">${esc(o.order_id)}</td>
      ${staff?`<td>${esc(o.account_id)}</td>`:''}
      <td><span class="badge">${esc(o.status)}</span></td><td>${esc(o.carrier)}</td></tr>`).join('')}</tbody></table>
    <h3 class="ph" style="margin-top:26px">Tickets</h3><p class="ps">${c.tickets.length} visible to you.</p>
    <table><thead><tr><th>Ticket</th>${staff?'<th>Account</th>':''}<th>Status</th><th>Subject</th></tr></thead>
    <tbody>${c.tickets.map(t=>`<tr><td class="m">${esc(t.ticket_id)}</td>
      ${staff?`<td>${esc(t.account_id)}</td>`:''}
      <td><span class="badge ${t.status==='open'?'open':''}">${esc(t.status)}</span></td>
      <td>${esc(t.subject)}</td></tr>`).join('')}</tbody></table></div>`;
}

function renderAccount(){
  const c=S.ctx;
  const govBlock=a=>Object.entries(a.governs||{}).map(([k,v])=>
    `<div class="gov"><span class="k">${esc(k.replace(/_/g,' '))}</span>
     <span class="v ${v.governed_by==='customer_agreement'?'c':''}">${esc(v.source)}</span></div>`).join('');
  $('#pAccount').innerHTML=`<div class="wcol">${
    c.accounts.length===1
    ? `<h3 class="ph">${esc(c.accounts[0].account_name)}</h3>
       <p class="ps">${esc(c.accounts[0].plan)} plan${c.accounts[0].has_agreement?' · signed agreement on file':' · no signed agreement, standard policy applies'}</p>
       <div class="note">Where a topic is shown in orange, your signed agreement overrides ParcelPilot's general policy for it.</div>
       <div class="card">${govBlock(c.accounts[0])}</div>`
    : `<h3 class="ph">Accounts</h3><p class="ps">Which source governs each topic, per account.</p>`+
      c.accounts.map(a=>`<div class="card"><h4>${esc(a.account_name)} — ${esc(a.plan)}
        ${a.has_agreement?'· agreement on file':'· no agreement'}</h4>${govBlock(a)}</div>`).join('')
  }</div>`;
}

function renderSources(){
  const c=S.ctx, T={1:'Signed agreement',2:'Current policy / SOP',3:'Product documentation',90:'Deprecated'};
  $('#pSources').innerHTML=`<div class="wcol">
    <h3 class="ph">Authority order</h3>
    <p class="ps">This ranking is mandated by Support Policy v3 §1 — it is not a heuristic this system invented.</p>
    <div class="note"><strong>1.</strong> Signed customer agreement &nbsp;·&nbsp;
      <strong>2.</strong> Current policy / SOP &nbsp;·&nbsp; <strong>3.</strong> Current product documentation<br>
      Deprecated documents are excluded from answers. Historical tickets are context only and may contain incorrect guidance.</div>
    <h3 class="ph" style="margin-top:26px">Supplied documents</h3>
    <p class="ps">Status and supersession are parsed from each document, not assigned by hand.</p>
    <div class="card">${c.documents.map(d=>`<div class="doc ${d.status==='DEPRECATED'?'dep':''}">
      <span class="tier t${d.tier===90?90:d.tier}">${esc((T[d.tier]||'').split(' ')[0].toUpperCase())}</span>
      <div><strong>${esc(d.doc)}</strong>
      ${d.effective?`<span style="color:var(--tx3)"> · effective ${esc(d.effective)}</span>`:''}
      ${d.superseded_by?`<br><span style="color:var(--tx3)">superseded by ${esc(d.superseded_by)}</span>`:''}</div>
    </div>`).join('')}</div>
    <h3 class="ph" style="margin-top:26px">Documented assumptions</h3>
    <p class="ps">Where the supplied documents are silent, this system states its assumption instead of inventing a rule.</p>
    ${Object.entries(c.assumptions).map(([k,v])=>
      `<div class="card"><h4>${esc(k.replace(/_/g,' '))}</h4><p>${esc(v)}</p></div>`).join('')}</div>`;
}
